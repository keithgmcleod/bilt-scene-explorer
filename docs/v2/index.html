<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Version two of the BILT scene explorer: click a Blender card to move to its camera."><title>BILT · Scene Explorer V2</title><link rel="stylesheet" href="style.css?v=2.10"><script type="importmap">{"imports":{"three":"../vendor/three.module.js"}}</script></head>
<body><main><div id="viewport" aria-label="Interactive Blender scene"></div><header><a class="brand" href="./">BILT<span>SCENE EXPLORER · V02</span></a><div class="header-actions"><button id="overview" hidden disabled>← Overview</button><span class="live"><i></i> LIVE 3D</span></div></header><section class="intro"><span class="eyebrow">A CHANGE IN PERSPECTIVE</span><h1>One scene.<br>Three perspectives.</h1><p>Click a 3D card to explore its camera view.</p></section><div id="loading" role="status"><span id="loading-text">Loading your scene…</span><div class="track"><div id="progress"></div></div><button id="retry" hidden>Try again</button></div><nav aria-label="Scene cameras"><button class="card" data-camera="1" disabled aria-pressed="false"><span class="number">02</span><span class="card-copy"><strong>BILT Obsidian</strong><small>Camera.002</small></span><span class="arrow">↗</span></button><button class="card" data-camera="2" disabled aria-pressed="false"><span class="number">03</span><span class="card-copy"><strong>BILT Palladium</strong><small>Camera.003</small></span><span class="arrow">↗</span></button><button class="card" data-camera="3" disabled aria-pressed="false"><span class="number">04</span><span class="card-copy"><strong>BILT Blue</strong><small>Camera.004</small></span><span class="arrow">↗</span></button></nav><footer><span id="status" role="status" aria-live="polite">Preparing scene</span><label><input id="animate-camera" type="checkbox" checked> Animate camera</label><label>Transition <input id="duration" type="range" min="0.4" max="4" step="0.1" value="1.8" aria-label="Camera transition duration"><output id="seconds">1.8s</output></label></footer></main><script type="module" src="app.js?v=2.12"></script></body></html>
