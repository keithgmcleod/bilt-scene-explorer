<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Explore the BILT Blender scene through cinematic camera transitions."><title>BILT · Scene Explorer</title><link rel="stylesheet" href="style.css"><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script></head>
<body><main><div id="viewport" aria-label="Interactive Blender scene"></div><header><a class="brand" href="./">BILT<span>SCENE EXPLORER</span></a><span class="live"><i></i> LIVE 3D</span></header><section class="intro"><span class="eyebrow">A CHANGE IN PERSPECTIVE</span><h1>One scene.<br>Two ways to see it.</h1><p>Click either card to move to the next camera.</p></section><div id="loading" role="status"><span id="loading-text">Loading your scene…</span><div class="track"><div id="progress"></div></div><button id="retry" hidden>Try again</button></div><nav aria-label="Scene cameras"><button class="card active" data-camera="0" disabled aria-pressed="true"><span class="number">01</span><span class="card-copy"><strong>The first perspective</strong><small>Camera.001 · Starting view</small></span><span class="arrow">↗</span></button><button class="card" data-camera="1" disabled aria-pressed="false"><span class="number">02</span><span class="card-copy"><strong>A closer look</strong><small>Camera.002 · Alternate view</small></span><span class="arrow">↗</span></button></nav><footer><span id="status" role="status" aria-live="polite">Preparing scene</span><label>Transition <input id="duration" type="range" min="0.4" max="4" step="0.1" value="1.8" aria-label="Camera transition duration"><output id="seconds">1.8s</output></label></footer></main><script type="module" src="app.js?v=2"></script></body></html>
